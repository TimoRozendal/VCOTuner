name: Test Builds
on:
  # run for all pull requests
  # Run for all commits on feature branches
  push:
  pull_request:
jobs:
  ###############################################################################
  # builds the application on windows
  testBuildWindows:
    runs-on: windows-latest

    steps:
    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28.x'

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure
      run: |
        cmake.exe -G "Visual Studio 17 2022" -A x64 -B build

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: VCOTuner_Windows
        path: build\VCOTuner_artefacts\Release\VCOTuner.exe

  ###############################################################################
  # builds the application on macos
  testBuildMacOS:
    runs-on: macos-latest

    steps:
    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28.x'

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure
      run: |
        cmake -G "Xcode" -B build -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

    - name: Build
      run: |
        cmake --build build --config Release

    # An .app is a directory containing symlinks. Zipping it on the Linux
    # release job would mangle them, so it is packaged here, on macOS.
    - name: Package the app bundle
      run: |
        cd build/VCOTuner_artefacts/Release
        ditto -c -k --keepParent VCOTuner.app VCOTuner-macOS.zip

    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: VCOTuner_MacOS
        path: build/VCOTuner_artefacts/Release/VCOTuner-macOS.zip

  ###############################################################################
  # builds the application on ubuntu
  testBuildUbuntu:
    runs-on: ubuntu-latest

    steps:
    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28.x'

    - name: Setup dependencies
      run: |
        sudo apt-get -y install g++ libfreetype6-dev libfontconfig1-dev libx11-dev libxinerama-dev libxrandr-dev libxcursor-dev mesa-common-dev libasound2-dev freeglut3-dev libxcomposite-dev

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure
      run: |
        cmake -G "Unix Makefiles" -B build

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: VCOTuner_Linux
        path: build/VCOTuner_artefacts/VCOTuner

  ###############################################################################
  # builds and runs the unit tests
  unitTests:
    runs-on: ubuntu-latest

    steps:
    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28.x'

    # The tests themselves link no JUCE, but configuring the project still
    # pulls in JUCE and bootstraps juceaide, which needs JUCE's build deps.
    - name: Setup dependencies
      run: |
        sudo apt-get -y install g++ libfreetype6-dev libfontconfig1-dev libx11-dev libxinerama-dev libxrandr-dev libxcursor-dev mesa-common-dev libasound2-dev freeglut3-dev libxcomposite-dev

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure
      run: |
        cmake -G "Unix Makefiles" -B build -DVCOTUNER_BUILD_TESTS=ON

    - name: Build tests
      run: |
        cmake --build build --target VCOTunerTests

    - name: Run tests
      run: |
        ctest --test-dir build --output-on-failure

  ###############################################################################
  # publishes a release when a v* tag is pushed. Does nothing on ordinary pushes.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [testBuildWindows, testBuildMacOS, testBuildUbuntu, unitTests]
    runs-on: ubuntu-latest
    permissions:
      # GITHUB_TOKEN is read-only by default; creating a release needs write.
      contents: write

    steps:
    - name: Download every build artifact
      uses: actions/download-artifact@v4

    - name: Publish the release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        body: |
          ## Before you download

          **Only the macOS build has been tested on real hardware.** The Windows
          and Linux binaries are produced by CI and have never been run against
          an actual oscillator, or run at all. They compile; that is all that is
          known about them. Treat them as untested.

          **macOS builds are not signed by Apple.** Gatekeeper will refuse to
          open the app and claim it is damaged. It isn't. Either right-click the
          app and choose Open, or clear the quarantine flag:

          ```
          xattr -dr com.apple.quarantine VCOTuner.app
          ```

          Signing properly needs a paid Apple Developer ID, which this project
          does not have.
        files: |
          VCOTuner_Windows/VCOTuner.exe
          VCOTuner_MacOS/VCOTuner-macOS.zip
          VCOTuner_Linux/VCOTuner
